schema = 1

[onepassword]
environment = "fakeenvironmentid000000000"   # an id, not a secret; synthetic

[secrets.GITHUB_PAT]
ref = "op://Example Vault/Fake GitHub Token/credential"
description = "Fine-grained PAT, contents:read on selected repos"

[secrets.LINEAR_TOKEN]
ref = "op-env://fakeenvironmentid000000000/LINEAR_TOKEN"   # 1Password Environment

[secrets.OTP_CODE]
ref = "op://Example Vault/Fake Login/section one/one-time password?attribute=otp"

[secrets.OPENAI_API_KEY]
ref = "keyring://loadout/OPENAI_API_KEY"

[secrets.HASS_TOKEN]
ref = "env:HASS_TOKEN"              # plain environment variable
env_name = "HASS_TOKEN"             # env var name used by env delivery (default: alias)
