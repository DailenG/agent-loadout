# Grok Build configuration (synthetic fixture)
model = "example-model"

[mcp_servers.github]
command = "npx"   # launcher
args = ["-y", "@modelcontextprotocol/server-github"]
startup_timeout_sec = 20

[mcp_servers.github.env]
GITHUB_PERSONAL_ACCESS_TOKEN = "${GITHUB_PAT}"

[mcp_servers.tracker]
url = "https://tracker.example.com/mcp"
headers = { Authorization = "Bearer ${TRACKER_TOKEN:-anonymous}" }
tool_timeout_sec = 2.5

[mcp_servers.events]
type = "sse"
url = "https://events.example.com/sse"

[mcp_servers.scoped]
command = "example-scoped-mcp"
cwd = "/srv/example"
