# cargo-deny policy (SPEC 18): permissive licenses only; GPL, AGPL, SSPL and
# unknown licenses are denied by not being listed.

[graph]
all-features = true

[advisories]
version = 2

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    # Permissive; Inflector, through core's optional `specta` feature
    # (specta-macros, M14).
    "BSD-2-Clause",
    # Permissive; the app crate's Tauri tree (`src-tauri`, M14): brotli's
    # alloc crates, libloading and foldhash/zlib-rs.
    "BSD-3-Clause",
    # Public-domain dedication; notify, the app crate's drift watcher
    # (SPEC 8.5).
    "CC0-1.0",
    # Permissive data license; Mozilla's root certificates in
    # webpki-root-certs, through reqwest's rustls-platform-verifier (the app
    # crate's Tauri tree and its updater plugin, M23).
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    # File-level copyleft; reached through dirs -> dirs-sys -> option-ext.
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
