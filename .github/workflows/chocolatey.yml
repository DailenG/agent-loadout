# Chocolatey (M25): publishes the agent-loadout package on the Chocolatey
# Community Repository when a GitHub release is published.
#
# packaging/chocolatey/agent-loadout/build.ps1 fills the package templates
# from the release (version, release notes link, installer URL, and the
# installer's SHA-256 from the release's SHA256SUMS) and packs them; the
# committed files never change. The job pushes that package unless the
# version is already on community.chocolatey.org (in any moderation
# state). Requests to Chocolatey are retried, since its feed answers 5xx
# from time to time. Nothing is installed from the Chocolatey feed.
#
# Run it by hand (workflow_dispatch) to publish a release whose run failed
# (`tag`), or a package-only fix (`package_version`, such as
# 0.8.0.20261201).
#
# Configuration: the `chocolatey` environment (deployment branches and
# tags: the default branch and v*) holds the secret CHOCO_API_KEY, an API
# key from https://community.chocolatey.org/account. Nothing here prints it.

name: Chocolatey

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (empty = the latest release)
        required: false
        default: ""
      package_version:
        description: Package version (empty = the release version; a fix uses 0.8.0.YYYYMMDD)
        required: false
        default: ""

permissions:
  contents: read

env:
  # A release event's ref is its tag; the package templates are taken from
  # the default branch.
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch || github.ref_name }}

concurrency:
  group: chocolatey
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !github.event.release.prerelease }}
    runs-on: windows-latest
    environment: chocolatey
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEFAULT_BRANCH }}
          persist-credentials: false

      - name: Build the package
        id: build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'nupkg'
          $package = ./packaging/chocolatey/agent-loadout/build.ps1 -Tag $env:TAG -PackageVersion $env:PACKAGE_VERSION -OutputDirectory $out
          "version=$($package.Version)" >> $env:GITHUB_OUTPUT
          "nupkg=$($package.Path)" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-loadout.${{ steps.build.outputs.version }}.nupkg
          path: ${{ steps.build.outputs.nupkg }}
          if-no-files-found: error

      - name: Push to the Chocolatey Community Repository if missing
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
          VERSION: ${{ steps.build.outputs.version }}
          NUPKG: ${{ steps.build.outputs.nupkg }}
        run: |
          $ErrorActionPreference = 'Stop'
          $page = "https://community.chocolatey.org/packages/agent-loadout/$env:VERSION"
          # 200: on the site in any moderation state; 404: missing. Anything
          # else (a 5xx, a timeout) is asked again.
          function Test-Published {
            for ($attempt = 1; $attempt -le 5; $attempt++) {
              try {
                $status = (Invoke-WebRequest -Uri $page -Method Head -SkipHttpErrorCheck -UseBasicParsing -TimeoutSec 60).StatusCode
              } catch {
                $status = $_.Exception.Message
              }
              if ($status -eq 200) { return $true }
              if ($status -eq 404) { return $false }
              "::warning::$page answered $status (attempt $attempt of 5)"
              Start-Sleep -Seconds (30 * $attempt)
            }
            throw "could not tell whether agent-loadout $env:VERSION is on the community repository"
          }
          if (Test-Published) {
            "agent-loadout $env:VERSION is already on the community repository; nothing to push."
            exit 0
          }
          if (-not $env:CHOCO_API_KEY) { throw 'CHOCO_API_KEY is not set on the chocolatey environment.' }
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco push $env:NUPKG --source https://push.chocolatey.org/ --api-key $env:CHOCO_API_KEY --no-progress
            $code = $LASTEXITCODE
            if ($code -eq 0) { exit 0 }
            # A push can fail after the server accepted it; ask the site.
            Start-Sleep -Seconds (60 * $attempt)
            if (Test-Published) { "agent-loadout $env:VERSION is on the community repository."; exit 0 }
            "::warning::choco push failed ($code), attempt $attempt of 3"
          }
          throw 'choco push failed 3 times'
