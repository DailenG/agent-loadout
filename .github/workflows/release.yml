# Release (SPEC 16, M23): on a version tag, builds the Windows NSIS installer
# (signed with Azure Trusted Signing when configured) and the Linux AppImage,
# .deb and .rpm on Ubuntu 22.04, then creates a draft GitHub release with
# every asset, SHA256SUMS, the AUR -bin tarball, the rendered winget
# manifests and, when the updater key is configured, latest.json.
#
# Configuration lives on the `release` environment (Settings > Environments
# > release; the environment is limited to v* tags), all optional: without
# it the release is unsigned and has no updater feed. Nothing here prints a
# secret: no `set -x`, no environment dumps, and secrets reach only the step
# that needs them.
#
#   Environment variables
#     LOADOUT_SIGN_ACCOUNT    Trusted Signing account name
#     LOADOUT_SIGN_ENDPOINT   e.g. https://eus.codesigning.azure.net
#     LOADOUT_SIGN_PROFILE    certificate profile name
#     LOADOUT_UPDATER_PUBKEY  public key from `npx tauri signer generate`
#     LOADOUT_UPDATER_ENDPOINT  optional; default is this repository's
#                             releases/latest/download/latest.json
#   Environment secrets
#     AZURE_TENANT_ID         Entra tenant of the signing service principal
#     AZURE_CLIENT_ID         its application (client) id
#     AZURE_CLIENT_SECRET     a client secret of that app registration
#     CODE_SIGNING_KIT_SSH_KEY  private half of a read-only deploy key on DailenG/code-signing-kit
#     TAURI_SIGNING_PRIVATE_KEY           private updater key (with the
#     TAURI_SIGNING_PRIVATE_KEY_PASSWORD  variable LOADOUT_UPDATER_PUBKEY)
#
# Signing runs only when all six signing values (the three variables and
# the three AZURE_* secrets) are set. It uses the service principal's client
# secret through the kit's Invoke-TrustedSigning (SPEC 16.1 decision,
# 2026-11-22); a GitHub OIDC federated credential, with no stored secret, is
# the documented future option.

name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag matches the crate and package versions
        id: check
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          workspace="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          app="$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)"
          npm="$(jq -r .version package.json)"
          aur="$(sed -n 's/^pkgver=//p' packaging/aur/agent-loadout/PKGBUILD)"
          for v in "$workspace" "$app" "$npm" "$aur"; do
            if [ "$v" != "$tag" ]; then
              echo "::error::tag $GITHUB_REF_NAME, but versions are workspace $workspace, app $app, package.json $npm, AUR $aur"
              exit 1
            fi
          done
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    environment: release
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # true or false only; no secret value enters this variable.
      SIGNING: ${{ vars.LOADOUT_SIGN_ACCOUNT != '' && vars.LOADOUT_SIGN_ENDPOINT != '' && vars.LOADOUT_SIGN_PROFILE != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_CLIENT_SECRET != '' }}
      UPDATER: ${{ vars.LOADOUT_UPDATER_PUBKEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Updater config
        if: env.UPDATER == 'true'
        shell: bash
        env:
          PUBKEY: ${{ vars.LOADOUT_UPDATER_PUBKEY }}
          ENDPOINT: ${{ vars.LOADOUT_UPDATER_ENDPOINT || 'https://github.com/DailenG/agent-loadout/releases/latest/download/latest.json' }}
        run: |
          jq -n --arg pubkey "$PUBKEY" --arg endpoint "$ENDPOINT" '{
            bundle: { createUpdaterArtifacts: true },
            plugins: { updater: {
              pubkey: $pubkey,
              endpoints: [$endpoint],
              requireSignedVersion: true,
              windows: { installMode: "passive" }
            } }
          }' > "$RUNNER_TEMP/tauri.updater.conf.json"

      - name: Code-signing kit
        if: env.SIGNING == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DailenG/code-signing-kit
          ssh-key: ${{ secrets.CODE_SIGNING_KIT_SSH_KEY }}
          path: code-signing-kit
          # Read from disk only; the token must not stay in .git/config
          # while npm and cargo build scripts run.
          persist-credentials: false
      - name: Signing tools
        if: env.SIGNING == 'true'
        shell: pwsh
        run: |
          Import-Module (Join-Path $env:GITHUB_WORKSPACE 'code-signing-kit\module\TrustedSigning\TrustedSigning.psd1')
          Install-TrustedSigningTool

      # signCommand (tauri.conf.json) runs scripts/sign-windows.ps1 for the
      # app, loadout.exe, the NSIS plugins, the uninstaller and the
      # installer; with the LOADOUT_SIGN_* values empty it prints "unsigned
      # dev build". The AZURE_* secrets are passed only when signing, and
      # only to this step; the kit's Invoke-TrustedSigning reads them from
      # the environment (Azure.Identity, client secret).
      - name: Build NSIS installer
        shell: pwsh
        env:
          LOADOUT_SIGN_KIT: ${{ env.SIGNING == 'true' && format('{0}\code-signing-kit', github.workspace) || '' }}
          LOADOUT_SIGN_ACCOUNT: ${{ env.SIGNING == 'true' && vars.LOADOUT_SIGN_ACCOUNT || '' }}
          LOADOUT_SIGN_ENDPOINT: ${{ env.SIGNING == 'true' && vars.LOADOUT_SIGN_ENDPOINT || '' }}
          LOADOUT_SIGN_PROFILE: ${{ env.SIGNING == 'true' && vars.LOADOUT_SIGN_PROFILE || '' }}
          AZURE_TENANT_ID: ${{ env.SIGNING == 'true' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ env.SIGNING == 'true' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ env.SIGNING == 'true' && secrets.AZURE_CLIENT_SECRET || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $configs = @('--config', 'src-tauri/tauri.release.conf.json')
          if ($env:UPDATER -eq 'true') { $configs += @('--config', (Join-Path $env:RUNNER_TEMP 'tauri.updater.conf.json')) }
          npx tauri build @configs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Installs the built installer silently into a temp folder: checks that
      # it ships loadout.exe next to the app, that the CLI runs, and (when
      # signing ran) that every shipped executable verifies.
      - name: Install, smoke test and verify signatures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = "src-tauri\target\release\bundle\nsis\Loadout_$($env:VERSION)_x64-setup.exe"
          $dir = Join-Path $env:RUNNER_TEMP 'loadout-install'
          $p = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$dir") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited with $($p.ExitCode)" }
          $files = @($installer) + @('agent-loadout-app.exe', 'loadout.exe', 'uninstall.exe' | ForEach-Object { Join-Path $dir $_ })
          foreach ($f in $files) { if (-not (Test-Path -LiteralPath $f)) { throw "missing $f" } }
          & (Join-Path $dir 'loadout.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'loadout --version failed' }
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (($userPath -split ';') -notcontains $dir) { throw 'the install folder is not on the user PATH' }
          if ($env:SIGNING -eq 'true') {
            Import-Module (Join-Path $env:GITHUB_WORKSPACE 'code-signing-kit\module\TrustedSigning\TrustedSigning.psd1')
            $signtool = Get-TrustedSigningTool -Name 'signtool.exe'
            foreach ($f in $files) {
              & $signtool verify /pa $f
              if ($LASTEXITCODE -ne 0) { throw "signtool verify /pa failed for $f" }
            }
          }
          else {
            Write-Output 'Signing is not configured: unsigned build, signatures not verified.'
          }

      - name: Collect assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp src-tauri/target/release/bundle/nsis/Loadout_${VERSION}_x64-setup.exe out/
          if [ "$UPDATER" = true ]; then
            cp src-tauri/target/release/bundle/nsis/Loadout_${VERSION}_x64-setup.exe.sig out/
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: out/
          if-no-files-found: error

  linux:
    needs: version
    runs-on: ubuntu-22.04
    environment: release
    env:
      VERSION: ${{ needs.version.outputs.version }}
      UPDATER: ${{ vars.LOADOUT_UPDATER_PUBKEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: WebKitGTK and other Tauri build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Updater config
        if: env.UPDATER == 'true'
        env:
          PUBKEY: ${{ vars.LOADOUT_UPDATER_PUBKEY }}
          ENDPOINT: ${{ vars.LOADOUT_UPDATER_ENDPOINT || 'https://github.com/DailenG/agent-loadout/releases/latest/download/latest.json' }}
        run: |
          jq -n --arg pubkey "$PUBKEY" --arg endpoint "$ENDPOINT" '{
            bundle: { createUpdaterArtifacts: true },
            plugins: { updater: {
              pubkey: $pubkey,
              endpoints: [$endpoint],
              requireSignedVersion: true
            } }
          }' > "$RUNNER_TEMP/tauri.updater.conf.json"

      # The updater config is in every Linux bundle, but the app turns the
      # updater on only in the binary Tauri stamps as the AppImage
      # (bundle_type); deb and rpm installs, and the AUR packages cut from
      # the deb, never update themselves (SPEC 16.2). On Linux the product
      # name, and so the package and file names, is agent-loadout
      # (tauri.linux.conf.json).
      - name: Build AppImage, deb and rpm
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          configs=(--config src-tauri/tauri.release.conf.json)
          if [ "$UPDATER" = true ]; then
            configs+=(--config "$RUNNER_TEMP/tauri.updater.conf.json")
          fi
          npx tauri build "${configs[@]}" --bundles appimage,deb,rpm

      - name: Smoke test and AUR tarball
        run: |
          set -euo pipefail
          bundle=src-tauri/target/release/bundle
          deb="$bundle/deb/agent-loadout_${VERSION}_amd64.deb"
          package=$(dpkg-deb -f "$deb" Package)
          if [ "$package" != agent-loadout ]; then
            echo "::error::deb Package is '$package', expected agent-loadout"; exit 1
          fi
          top="agent-loadout-${VERSION}-x86_64-linux"
          mkdir -p "stage/$top"
          dpkg-deb -x "$deb" "stage/$top"
          # Check the extracted tree, not `dpkg-deb -c` text: Tauri writes
          # entries without a leading ./, and the listing format is not a
          # contract.
          for bin in loadout agent-loadout-app; do
            if [ ! -x "stage/$top/usr/bin/$bin" ]; then
              echo "::error::the deb has no /usr/bin/$bin"; ls -la "stage/$top/usr/bin" || true; exit 1
            fi
          done
          "stage/$top/usr/bin/loadout" --version
          cp LICENSE THIRD_PARTY_NOTICES.md "stage/$top/"
          mkdir -p out
          tar -C stage -czf "out/$top.tar.gz" "$top"
          cp "$deb" "$bundle/rpm/agent-loadout-${VERSION}-1.x86_64.rpm" "$bundle/appimage/agent-loadout_${VERSION}_amd64.AppImage" out/
          if [ "$UPDATER" = true ]; then
            cp "$bundle/appimage/agent-loadout_${VERSION}_amd64.AppImage.sig" out/
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: out/
          if-no-files-found: error

  publish:
    needs: [version, windows, linux]
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Gather assets
        run: |
          set -euo pipefail
          mkdir -p dist
          cp artifacts/windows/* artifacts/linux/* dist/

      # The updater feed (SPEC 16.4): the NSIS installer for Windows and the
      # AppImage for Linux, each with its minisign signature.
      - name: latest.json
        run: |
          set -euo pipefail
          win="Loadout_${VERSION}_x64-setup.exe"
          app="agent-loadout_${VERSION}_amd64.AppImage"
          if [ ! -f "dist/$win.sig" ] || [ ! -f "dist/$app.sig" ]; then
            echo "No updater signatures (LOADOUT_UPDATER_PUBKEY not set): no latest.json."
            exit 0
          fi
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          jq -n \
            --arg version "$VERSION" \
            --arg notes "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg winsig "$(cat "dist/$win.sig")" --arg winurl "$base/$win" \
            --arg appsig "$(cat "dist/$app.sig")" --arg appurl "$base/$app" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $date,
              platforms: {
                "windows-x86_64": { signature: $winsig, url: $winurl },
                "windows-x86_64-nsis": { signature: $winsig, url: $winurl },
                "linux-x86_64": { signature: $appsig, url: $appurl },
                "linux-x86_64-appimage": { signature: $appsig, url: $appurl }
              }
            }' > dist/latest.json

      - name: winget manifests
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'winget'
          & ./packaging/winget/render.ps1 -Version $env:VERSION -Installer "dist/Loadout_$($env:VERSION)_x64-setup.exe" -OutDir $out
          Compress-Archive -Path (Join-Path $out 'manifests') -DestinationPath "dist/winget-manifests-$($env:VERSION).zip"

      - name: SHA256SUMS
        run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS

      # A draft: the maintainer reviews and publishes it. latest.json is
      # served from releases/latest only once the release is published. The
      # notes are this version's CHANGELOG.md section, followed by the
      # generated list of pull requests and the compare link.
      - name: Draft release
        run: |
          set -euo pipefail
          awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 { f = 1; next } f && /^## / { exit } f' \
            CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::warning::CHANGELOG.md has no section for $VERSION; add the summary to the draft by hand"
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft --verify-tag --generate-notes --notes-file "$RUNNER_TEMP/notes.md" \
            --title "Loadout $VERSION"
