name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  hygiene:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: No baked-in ids
        run: bash scripts/check-no-baked-ids.sh

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: docs/cli.md matches the CLI help
        if: runner.os == 'Linux'
        run: node scripts/gen-cli-docs.mjs --check

  # SPEC 16.2: the Arch container runs the workspace tests, the frontend
  # tests and the AUR packages' `makepkg --nobuild` validation.
  archlinux:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: System packages
        run: pacman -Syu --noconfirm --needed base-devel git rustup nodejs npm namcap
      - uses: actions/checkout@v4
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - run: cargo test --workspace --locked
      - run: npm ci
      - run: npm test
      # makepkg refuses root and checks the runtime dependencies, so they
      # are installed (which also proves every name exists in the Arch
      # repositories) and an unprivileged user runs the validation.
      - name: AUR runtime dependencies
        run: |
          pacman -S --noconfirm --needed $(sed -n 's/^\tdepends = //p' packaging/aur/agent-loadout/.SRCINFO)
          useradd --create-home builder
          chown -R builder "$GITHUB_WORKSPACE"
      - name: makepkg --nobuild
        run: sudo -u builder -H bash -c 'cd "$1" && rustup default stable && bash packaging/aur/validate.sh' _ "$GITHUB_WORKSPACE"

  deny:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Frontend (M14): Vitest against the mock transport, and the type check.
  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit

  # Desktop app crate (M14). `src-tauri` is a workspace of its own, so the
  # jobs above never build Tauri or need WebKitGTK.
  app:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: WebKitGTK and other Tauri build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: npx tauri build --debug

  app-deny:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: src-tauri/Cargo.toml
