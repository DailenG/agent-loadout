# Weekly version updates, one grouped pull request per ecosystem and folder.
# Security updates are separate (Settings, Code security).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      cargo:
        patterns: ["*"]
    commit-message:
      prefix: "deps(cargo)"

  # The desktop app crate is a workspace of its own with its own Cargo.lock.
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      cargo-app:
        patterns: ["*"]
    commit-message:
      prefix: "deps(app)"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      npm:
        patterns: ["*"]
    commit-message:
      prefix: "deps(npm)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
