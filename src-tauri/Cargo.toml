[package]
name = "agent-loadout-app"
description = "Loadout desktop app (Tauri); commands are thin wrappers over agent-loadout-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/DailenG/agent-loadout"
publish = false

# A workspace of its own (SPEC 4.1 layout, M14 note): Tauri, WebView2 and
# WebKitGTK stay out of the root workspace, so `cargo test --workspace` at
# the root needs no WebView tooling. `npx tauri build` builds this crate;
# its own gates run with `--manifest-path src-tauri/Cargo.toml`.
[workspace]

[[bin]]
name = "agent-loadout-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
agent-loadout-core = { path = "../crates/agent-loadout-core", features = ["specta"] }
# SPEC 4.4 and 8.5: the drift watcher on target files, manifests and skill
# folders (CC0-1.0; ReadDirectoryChangesW, inotify, FSEvents). 8.x, since
# 9.0 adds a dependency under BSL-1.0 (xxhash-rust).
notify = "8"
serde = { version = "1", features = ["derive"] }
# JSON-escaped forms of masked values in previews; tauri.conf.json in tests.
serde_json = "1"
# Pinned together: tauri-specta 2.0.0-rc.29 is built against specta rc.28.
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
specta-typescript = "0.0.15"
tauri = { version = "2.12", features = [] }
# SPEC 4.3 plugin: the OS folder picker of the Projects page (Add folder,
# Init manifest), opened from Rust.
tauri-plugin-dialog = "2.8"
# SPEC 16.4 (optional updater, named in 4.3): registered only when a release
# config supplies `plugins.updater` (M23). rustls with ring; no zip/tar,
# since the v2 updater artifacts are the NSIS installer and the AppImage.
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
# Temp homes and the rooted file system for the command tests (SPEC 19).
agent-loadout-testkit = { path = "../crates/agent-loadout-testkit" }
