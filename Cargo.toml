[workspace]
resolver = "3"
members = [
    "crates/agent-loadout-core",
    "crates/agent-loadout",
    "crates/agent-loadout-testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/DailenG/agent-loadout"

[workspace.dependencies]
agent-loadout-core = { path = "crates/agent-loadout-core", version = "0.1.0" }
agent-loadout-testkit = { path = "crates/agent-loadout-testkit" }
clap = { version = "4", features = ["derive"] }
dirs = "6"
getrandom = "0.4"
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
insta = { version = "1", default-features = false }
jsonc-parser = { version = "0.34", features = ["cst"] }
proptest = { version = "1", default-features = false, features = ["std"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "1"
toml_edit = "0.25"

[workspace.lints.rust]
unsafe_code = "forbid"
