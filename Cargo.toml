[workspace]
resolver = "3"
members = [
    "crates/agent-loadout-core",
    "crates/agent-loadout",
    "crates/agent-loadout-testkit",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/DailenG/agent-loadout"
homepage = "https://daileng.github.io/agent-loadout/"
keywords = ["mcp", "ai", "claude", "codex", "config"]
categories = ["command-line-utilities", "development-tools", "config"]

[workspace.dependencies]
agent-loadout-core = { path = "crates/agent-loadout-core", version = "0.4.0" }
agent-loadout-testkit = { path = "crates/agent-loadout-testkit" }
clap = { version = "4", features = ["derive"] }
dirs = "6"
getrandom = "0.4"
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
hmac = "0.13"
insta = { version = "1", default-features = false }
# JSON5 files are read with this (SPEC 7.2); writes go through the JSONC
# CST, and only for files that also parse as JSONC.
json5 = "1"
jsonc-parser = { version = "0.34", features = ["cst"] }
# Windows directory junctions for skill links (SPEC 12.2): created through
# Win32 APIs, no Developer Mode or admin needed. The `unstable_admin`
# default feature (privilege adjustment) is left out.
junction = { version = "2", default-features = false }
# OS keyring (SPEC 11.2): Windows Credential Manager, macOS Keychain,
# Secret Service on Linux (pure Rust zbus client, no libdbus).
keyring = "4"
# Linux only: asks the Secret Service whether an entry is locked before the
# keyring crate reads it (that crate unlocks, and an unlock prompt that
# cannot appear hangs forever). The version keyring already uses.
secret-service = { version = "5", features = ["crypto-rust"] }
proptest = { version = "1", default-features = false, features = ["std"] }
# Built-in scanner rules (SPEC 17, #25): the rules ship as data, so their
# patterns need an engine with linear-time matching (no backtracking, so a
# rule cannot hang on crafted content). Already in the tree.
regex = "1"
# YAML span splice (SPEC 7.2): saphyr's event parser, whose events carry
# source spans.
saphyr-parser = "0.4"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# 2.x, the version insta already pulls in.
similar = "2"
# loadout.exe links the VC runtime statically and the UCRT (part of
# Windows) dynamically, as Tauri does for the app, so the CLI runs on a
# machine without the Visual C++ Redistributable (0.1.2 did not: STATUS_DLL_NOT_FOUND).
static_vcruntime = "3"
# TypeScript types for the app's typed IPC (SPEC 4.3); pinned to the
# release tauri-specta 2.0.0-rc.29 is built against. Core enables it only
# behind its optional `specta` feature.
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
tempfile = "3"
# Unix write probes (SPEC 8.2 `read_only_target`): `access(2)` and the
# effective user id, without `unsafe` in core. Already in the tree through
# tempfile.
rustix = { version = "1", default-features = false, features = ["std", "fs", "process"] }
toml = "1"
toml_edit = "0.25"
# Git source URLs (#24): parsed as git/curl parse them (WHATWG), so a source
# key names the host and path git contacts. The version the app already
# pulls in through Tauri.
url = "2"
windows-permissions = "0.2"
# Job Objects for `loadout exec` on Windows (SPEC 11.5): a safe wrapper, so
# the workspace keeps `unsafe_code = "forbid"`.
win32job = "2"
# Archive folder remotes and `restore --from <zip>` (SPEC 9.6). Deflate
# only, through flate2's pure Rust miniz_oxide backend (MIT/Apache); the
# other zip codecs are left out.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[workspace.lints.rust]
unsafe_code = "forbid"

# `loadout` (the CLI): smaller and faster than the default profile (#10).
# The app is its own workspace (`src-tauri/Cargo.toml`), with the same profile.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
