[package]
name = "agent-loadout-core"
description = "Core library of Loadout: MCP servers, skills and secret references for AI coding clients"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
getrandom.workspace = true
# Known Folders for `Env::from_process` (the CLI and the app).
dirs.workspace = true
git2.workspace = true
hmac.workspace = true
json5.workspace = true
jsonc-parser.workspace = true
keyring.workspace = true
saphyr-parser.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
similar.workspace = true
toml.workspace = true
toml_edit.workspace = true
zip.workspace = true
# Only to select zip's deflate backend (miniz_oxide).
flate2.workspace = true
# Optional: `specta::Type` for IPC types the app sends (`agent-loadout-app`,
# SPEC 4.3). Off for the CLI.
specta = { workspace = true, optional = true }

# User-only ACLs on backups and private state files, and the original DACL
# on replaced client files (SPEC 8.4), without `unsafe` in this crate.
[target.'cfg(windows)'.dependencies]
windows-permissions.workspace = true
# Skill links (SPEC 12.2): directory junctions without admin rights.
junction.workspace = true

# Lock state of Secret Service entries (SPEC 11.3 `locked`, gate V1 FB-6).
[target.'cfg(target_os = "linux")'.dependencies]
secret-service.workspace = true

[dev-dependencies]
agent-loadout-testkit.workspace = true
insta.workspace = true
proptest.workspace = true

# Skill tests make junctions inside their temp root (link escapes, tool
# folder classification).
[target.'cfg(windows)'.dev-dependencies]
junction.workspace = true

[lints]
workspace = true
